server {
    listen 80;
    server_name localhost;

    # 1) Servir el build de React
    root /ruta/a/entradasyadb/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2) Proxy a cada microservicio
    location /api/auth/           { proxy_pass http://127.0.0.1:3001/; }
    location = /api/eventos       { proxy_pass http://127.0.0.1:3002/api/events; }
    location /api/eventos/        { proxy_pass http://127.0.0.1:3002/api/events/; }
    location = /api/ordenes      { proxy_pass http://127.0.0.1:3003/; }
    location /api/ordenes/       { proxy_pass http://127.0.0.1:3003/; }
    location /api/orders/        { proxy_pass http://127.0.0.1:3003/; }
    #location /api/pagos/          { proxy_pass http://127.0.0.1:3004/; }
    location /api/payments/          { proxy_pass http://127.0.0.1:3004/; }
    location /api/tickets/        { proxy_pass http://127.0.0.1:3005; }
    location /api/notificaciones/ {
        rewrite ^/api/notificaciones/(.*)$ /api/notifications/$1 break;
        proxy_pass http://127.0.0.1:3006;
    }
    location /api/checkin/        { proxy_pass http://127.0.0.1:3007/; }
    location /api/reportes/       { proxy_pass http://127.0.0.1:3008/; }
}